<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IconGallery · 图标选型库</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='2' y='2' width='9' height='9' rx='2.5' fill='%236366f1'/%3E%3Crect x='13' y='2' width='9' height='9' rx='2.5' fill='%23a78bfa'/%3E%3Crect x='2' y='13' width='9' height='9' rx='2.5' fill='%23c7d2fe'/%3E%3Crect x='13' y='13' width='9' height='9' rx='2.5' fill='%238b5cf6'/%3E%3C/svg%3E">
<script>
/* 主题初始化（默认深色），在渲染前设置避免闪烁 */
(function(){
  try{
    var t = JSON.parse(localStorage.getItem('ig:theme') || 'null');
    if(t !== 'light') document.documentElement.classList.add('dark');
  }catch(e){ document.documentElement.classList.add('dark'); }
})();
</script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: { extend: { fontFamily: {
    sans: ['-apple-system','BlinkMacSystemFont','Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue','Arial','sans-serif'],
    mono: ['ui-monospace','SFMono-Regular','Menlo','Consolas','Liberation Mono','monospace']
  }}}
};
</script>
<style>
:root{
  --icon-size:40px; --stroke-w:2; --ms-fill:0; --ms-wght:400;
  --icon-fg:#27272a;
  --card-bg:#ffffff; --card-bd:#e4e4e7; --card-bg-h:#fafafa;
  --label:#71717a; --label-h:#3f3f46;
  --seg-bg:rgba(228,228,231,.7); --seg-on:#ffffff; --seg-on-fg:#18181b; --seg-shadow:0 1px 2px rgba(0,0,0,.1);
  --hover-bg:rgba(228,228,231,.4); --glyph-bg:#f4f4f5;
  --code-bg:#fafafa;
}
html.dark{
  --icon-fg:#d4d4d8;
  --card-bg:rgba(24,24,27,.45); --card-bd:#27272a; --card-bg-h:rgba(24,24,27,.9);
  --label:#71717a; --label-h:#a1a1aa;
  --seg-bg:rgba(39,39,42,.7); --seg-on:#3f3f46; --seg-on-fg:#fafafa; --seg-shadow:none;
  --hover-bg:rgba(39,39,42,.5); --glyph-bg:rgba(63,63,70,.4);
  --code-bg:rgba(9,9,11,.55);
}
.ig-hide{display:none!important}
[data-ctl]{display:none}
[data-ctl].on{display:block}

/* ---------- 图标插槽 ---------- */
.slot{display:inline-flex;align-items:center;justify-content:center;width:var(--icon-size);height:var(--icon-size);font-size:var(--icon-size);color:var(--icon-color,var(--icon-fg));flex:none;line-height:1}
.slot .glyph{font-size:inherit;line-height:1}
.slot svg{width:100%;height:100%;stroke-width:var(--stroke-w,2)}
.slot .material-symbols-rounded{font-size:inherit;line-height:1;font-variation-settings:'FILL' var(--ms-fill,0),'wght' var(--ms-wght,400),'GRAD' 0,'opsz' 24}
.lucide-holder{display:inline-flex;width:100%;height:100%}
.sk{width:56%;height:56%;border-radius:8px;background:currentColor;opacity:.14;animation:pulse 1.1s ease-in-out infinite}

/* ---------- 图标网格 ---------- */
.ig-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.card{display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 6px 10px;border-radius:14px;border:1px solid var(--card-bd);background:var(--card-bg);cursor:pointer;min-width:0;transition:border-color .15s,background-color .15s,transform .15s;animation:cardIn .3s ease both}
.card:hover{border-color:rgba(99,102,241,.55);background:var(--card-bg-h);transform:translateY(-2px)}
.card:focus-visible{outline:2px solid #6366f1;outline-offset:2px}
.cname{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--label);text-align:center;transition:color .15s}
.card:hover .cname{color:var(--label-h)}
@keyframes cardIn{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
@keyframes pulse{50%{opacity:.05}}

/* ---------- 侧栏库列表 ---------- */
.lib-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:12px;border:1px solid transparent;cursor:pointer;transition:background .15s,border-color .15s;text-align:left}
.lib-item:hover{background:var(--hover-bg)}
.lib-glyph{width:34px;height:34px;flex:none;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;background:var(--glyph-bg);color:var(--icon-fg);font-size:16px;overflow:hidden}
.lib-title{display:flex;align-items:center;font-size:13px;font-weight:500;color:var(--label-h)}
.lib-sub{display:block;font-size:11px;color:var(--label);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lib-item.active{border-color:rgba(99,102,241,.45);background:rgba(99,102,241,.08)}
.lib-item.active .lib-title{color:#6366f1}
html.dark .lib-item.active .lib-title{color:#a5b4fc}

/* ---------- 分段选择器 ---------- */
.seg{display:flex;gap:4px;padding:4px;border-radius:11px;background:var(--seg-bg)}
.seg button{flex:1;padding:5px 2px;font-size:12px;border-radius:8px;color:var(--label);cursor:pointer;transition:.15s;white-space:nowrap}
.seg button:hover{color:var(--label-h)}
.seg button.active{background:var(--seg-on);color:var(--seg-on-fg);font-weight:500;box-shadow:var(--seg-shadow)}
.seg-wrap{flex-wrap:wrap}
.seg-wrap button{flex:1 1 28%}

/* ---------- 开关 / 色块 / 筹码 ---------- */
.switch{width:38px;height:22px;flex:none;border-radius:999px;background:var(--seg-bg);border:1px solid var(--card-bd);position:relative;cursor:pointer;transition:.2s}
.switch.on{background:#6366f1;border-color:#6366f1}
.switch .knob{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch.on .knob{left:18px}
.sw{width:24px;height:24px;border-radius:8px;border:1px solid rgba(0,0,0,.12);cursor:pointer;position:relative;flex:none;transition:.15s}
.sw.auto{background:linear-gradient(135deg,#27272a 50%,#e4e4e7 50%)}
.sw.custom{background:conic-gradient(#f87171,#fbbf24,#34d399,#60a5fa,#a78bfa,#f472b6,#f87171)}
.sw.active{outline:2px solid #6366f1;outline-offset:2px}
.chip{flex:none;padding:6px 12px;border-radius:999px;font-size:12px;color:var(--label);border:1px solid var(--card-bd);background:var(--card-bg);cursor:pointer;transition:.15s;white-space:nowrap}
.chip.active{color:#6366f1;border-color:rgba(99,102,241,.5);background:rgba(99,102,241,.08);font-weight:500}

/* ---------- 弹窗 / 代码行 / 提示 ---------- */
.code-box{flex:1;min-width:0;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;line-height:1.6;padding:8px 10px;border-radius:8px;border:1px solid var(--card-bd);background:var(--code-bg);color:var(--label-h);outline:none;resize:none}
.code-box:focus{border-color:rgba(99,102,241,.5)}
.copy-btn{flex:none;width:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--label);border:1px solid var(--card-bd);background:var(--card-bg);cursor:pointer;transition:.15s}
.copy-btn:hover{color:#6366f1;border-color:rgba(99,102,241,.5)}
.size-cell{display:flex;flex-direction:column;align-items:center;gap:6px}
.size-cell>span{font-size:10px;font-family:ui-monospace,Menlo,monospace;color:var(--label)}
.spinner{width:26px;height:26px;border-radius:50%;border:3px solid rgba(99,102,241,.18);border-top-color:#6366f1;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;background:#18181b;color:#fafafa;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;transform:translateY(10px);transition:opacity .2s,transform .2s;pointer-events:none}
html.dark .toast{background:#fafafa;color:#18181b}
.toast.show{opacity:1;transform:none}

/* ---------- 滚动条 ---------- */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(120,120,130,.3);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:rgba(120,120,130,.5)}
::-webkit-scrollbar-track{background:transparent}

/* ---------- 移动端抽屉侧栏 ---------- */
@media (max-width:1023px){
  #sidebar{position:fixed;top:0;left:0;bottom:0;z-index:40;transform:translateX(-100%);transition:transform .22s ease;box-shadow:0 0 40px rgba(0,0,0,.25);background:#fff}
  html.dark #sidebar{background:#18181b}
  #sidebar.open{transform:translateX(0)}
}
input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:var(--seg-bg)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;border-radius:50%;background:#6366f1;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.25)}
</style>
</head>
<body class="bg-zinc-50 dark:bg-zinc-950 text-zinc-800 dark:text-zinc-200 font-sans antialiased overflow-hidden">

<div class="flex h-screen overflow-hidden">

  <!-- ================= 侧栏 ================= -->
  <aside id="sidebar" class="w-64 shrink-0 flex flex-col border-r border-zinc-200 dark:border-zinc-800/70 bg-white dark:bg-zinc-900/40">
    <div class="px-4 pt-5 pb-4 border-b border-zinc-200/70 dark:border-zinc-800/70 flex items-center gap-2.5">
      <svg viewBox="0 0 24 24" class="w-7 h-7 text-zinc-700 dark:text-zinc-300" aria-hidden="true">
        <rect x="2" y="2" width="9" height="9" rx="2.5" fill="#6366f1"/>
        <rect x="13" y="2" width="9" height="9" rx="2.5" fill="#a78bfa"/>
        <rect x="2" y="13" width="9" height="9" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <rect x="13" y="13" width="9" height="9" rx="2.5" fill="#8b5cf6"/>
      </svg>
      <div class="min-w-0">
        <div class="font-semibold text-[15px] leading-tight">IconGallery</div>
        <div class="text-[11px] text-zinc-400">图标选型工作台</div>
      </div>
      <button id="drawer-close" class="lg:hidden ml-auto w-8 h-8 rounded-lg text-zinc-400 hover:text-zinc-700 dark:hover:text-zinc-200 hover:bg-zinc-100 dark:hover:bg-zinc-800 text-lg leading-none" aria-label="关闭侧栏">×</button>
    </div>

    <div class="flex-1 overflow-y-auto px-3 py-4">
      <div class="px-2 pb-2 text-[11px] font-medium text-zinc-400 tracking-widest">图标库</div>
      <div id="lib-list" class="space-y-1"></div>

      <div class="px-2 pt-6 pb-2 text-[11px] font-medium text-zinc-400 tracking-widest">预览设置</div>
      <div class="space-y-5 px-1">
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <span class="text-xs text-zinc-500">图标尺寸</span>
            <span id="size-val" class="text-xs font-mono text-zinc-400">40px</span>
          </div>
          <input id="size-slider" type="range" min="16" max="96" step="4" value="40" class="w-full accent-indigo-500 cursor-pointer">
        </div>

        <div>
          <div class="text-xs text-zinc-500 mb-2">图标颜色</div>
          <div id="swatches" class="flex flex-wrap gap-2"></div>
        </div>

        <div data-ctl="lucide">
          <div class="flex items-center justify-between mb-1.5">
            <span class="text-xs text-zinc-500">描边粗细</span>
            <span id="stroke-val" class="text-xs font-mono text-zinc-400">2</span>
          </div>
          <input id="stroke-slider" type="range" min="1" max="3" step="0.1" value="2" class="w-full accent-indigo-500 cursor-pointer">
        </div>

        <div data-ctl="remix">
          <div class="text-xs text-zinc-500 mb-1.5">风格</div>
          <div id="remix-seg" class="seg">
            <button data-v="line">线条</button><button data-v="fill">填充</button>
          </div>
        </div>

        <div data-ctl="phosphor">
          <div class="text-xs text-zinc-500 mb-1.5">字重风格</div>
          <div id="ph-seg" class="seg seg-wrap">
            <button data-v="thin">细</button><button data-v="light">轻</button><button data-v="regular">常规</button>
            <button data-v="bold">粗</button><button data-v="fill">填充</button><button data-v="duotone">双色</button>
          </div>
        </div>

        <div data-ctl="material">
          <div class="flex items-center justify-between mb-3">
            <span class="text-xs text-zinc-500">填充样式</span>
            <button id="ms-fill" class="switch" role="switch" aria-checked="false"><span class="knob"></span></button>
          </div>
          <div class="flex items-center justify-between mb-1.5">
            <span class="text-xs text-zinc-500">字重</span>
            <span id="ms-wght-val" class="text-xs font-mono text-zinc-400">400</span>
          </div>
          <input id="ms-wght" type="range" min="100" max="700" step="100" value="400" class="w-full accent-indigo-500 cursor-pointer">
        </div>

        <div data-ctl="fontawesome">
          <div class="text-xs text-zinc-500 mb-1.5">风格</div>
          <div id="fa-seg" class="seg">
            <button data-v="solid">实心</button><button data-v="regular">常规</button><button data-v="brands">品牌</button>
          </div>
        </div>

        <div data-ctl="heroicons">
          <div class="text-xs text-zinc-500 mb-1.5">风格</div>
          <div id="hi-seg" class="seg">
            <button data-v="outline">线条</button><button data-v="solid">实心</button><button data-v="mini">迷你</button>
          </div>
        </div>

        <div data-ctl="ionicons">
          <div class="text-xs text-zinc-500 mb-1.5">风格</div>
          <div id="ion-seg" class="seg">
            <button data-v="filled">填充</button><button data-v="outline">线条</button><button data-v="sharp">棱角</button>
          </div>
        </div>

        <div data-ctl="boxicons">
          <div class="text-xs text-zinc-500 mb-1.5">风格</div>
          <div id="bx-seg" class="seg">
            <button data-v="regular">常规</button><button data-v="solid">实心</button><button data-v="logos">Logo</button>
          </div>
        </div>
      </div>
    </div>

    <div class="px-4 py-3 border-t border-zinc-200/70 dark:border-zinc-800/70 text-[11px] text-zinc-400 leading-relaxed">
      数据来自各图标库官方 CDN，仅用于预览选型。
    </div>
  </aside>

  <!-- ================= 主区域 ================= -->
  <main class="flex-1 flex flex-col min-w-0">

    <header class="shrink-0 z-20 flex items-center gap-2 sm:gap-3 px-3 sm:px-5 h-14 border-b border-zinc-200 dark:border-zinc-800/70 bg-zinc-50/90 dark:bg-zinc-950/90 backdrop-blur">
      <button id="menu-btn" class="lg:hidden w-9 h-9 -ml-1 rounded-xl flex items-center justify-center text-zinc-500 hover:text-zinc-800 dark:hover:text-zinc-100 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition" aria-label="打开侧栏">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="w-5 h-5"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>

      <div class="relative flex-1 max-w-xl">
        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-zinc-400 pointer-events-none">

        </span>
        <input id="search" type="text" autocomplete="off" spellcheck="false" placeholder="搜索图标，支持中文（如：删除 / 保存 / 天气），按 / 聚焦"          class="w-full h-7 pl-9 pr-11 rounded-full bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 focus:border-indigo-500/60 focus:ring-4 focus:ring-indigo-500/10 outline-none text-sm placeholder:text-zinc-400 transition">
        <button id="clear-search" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 w-6 h-6 rounded-md text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-200 text-base leading-none" aria-label="清空搜索">×</button>
        <kbd id="kbd-hint" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-[10px] font-mono text-zinc-400 border border-zinc-200 dark:border-zinc-700 rounded px-1.5 py-0.5 pointer-events-none">/</kbd>
      </div>

      <div id="count" class="text-xs font-mono text-zinc-400 tabular-nums whitespace-nowrap"></div>

      <button id="theme-btn" class="ml-auto h-7 pl-2 pr-2.5 rounded-full border border-zinc-200 dark:border-zinc-800 flex items-center gap-1 text-zinc-500 hover:text-zinc-800 dark:hover:text-zinc-100 hover:border-zinc-300 dark:hover:border-zinc-700 transition" aria-label="切换主题">
        <span id="icon-sun" class="inline-flex items-center gap-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="w-4 h-4"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg><span class="text-xs font-medium">明亮</span></span>
        <span id="icon-moon" class="hidden"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg><span class="text-xs font-medium">黑暗</span></span>
      </button>

    <div id="kw-bar" class="ig-hide shrink-0 flex items-center gap-2 overflow-x-auto px-3 sm:px-5 py-2 border-b border-zinc-200 dark:border-zinc-800/70 bg-indigo-50/60 dark:bg-indigo-950/20">

        中文匹配

    </div>

    <div id="content" class="flex-1 overflow-y-auto min-h-0">

  </main>
</div>

<!-- 抽屉遮罩（移动端） -->
<div id="drawer-mask" class="ig-hide fixed inset-0 z-30 bg-black/60 backdrop-blur-sm"></div>

<!-- ================= 图标详情弹窗 ================= -->
<div id="modal" style="display:none" class="fixed inset-0 z-50 items-center justify-center p-4">
  <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" data-close></div>
  <div class="relative w-full max-w-xl bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-2xl shadow-2xl max-h-[88vh] overflow-y-auto p-5 sm:p-6">
    <button data-close class="absolute top-3.5 right-3.5 w-8 h-8 rounded-lg flex items-center justify-center text-zinc-400 hover:text-zinc-700 dark:hover:text-zinc-200 hover:bg-zinc-100 dark:hover:bg-zinc-800 text-lg leading-none" aria-label="关闭">×</button>
    <div class="flex items-center gap-3 mb-5 pr-8">
      <span id="m-lib" class="text-xs px-2 py-0.5 rounded-full bg-indigo-500/10 text-indigo-600 dark:text-indigo-300 font-medium whitespace-nowrap"></span>

/* ================= 工具 ================= */
const $ = s => document.querySelector(s);

async function fetchText(url){
  const r = await fetch(url);
  if(!r.ok) throw new Error('HTTP ' + r.status + ' · ' + url);
  return r.text();
}

/* ================= 各图标库加载器（解析官方 CDN） ================= */

async function loadLucide(){
  const meta = await (await fetch('https://data.jsdelivr.com/v1/packages/npm/lucide-static')).json();
  const ver = (meta.tags && meta.tags.latest) || meta.versions[meta.versions.length - 1];
  const tree = await (await fetch('https://data.jsdelivr.com/v1/packages/npm/lucide-static@' + ver + '?structure=flat')).json();
  const names = tree.files
    .filter(f => f.name.startsWith('/icons/') && f.name.endsWith('.svg'))
    .map(f => f.name.slice(7, -4))
    .sort();
  if(!names.length) throw new Error('empty lucide list');
  /* 官方 tags（英文关键词）增强中文搜索命中 */
  let tags = {};
  try{
    const t = await (await fetch('https://cdn.jsdelivr.net/npm/lucide-static@' + ver + '/tags.json')).json();
    Object.keys(t).forEach(k => { if(t[k] && t[k].tags) tags[k] = t[k].tags; });
  }catch(e){}
  return { names, tags };
}

const TI_SKIP = new Set(['xs','sm','md','lg','xl','1x','2x','3x','4x','5x','6x','7x','8x','9x','10x','rotate','rotate-45','rotate-90','rotate-180','rotate-270','rotate-2','flip','flip-horizontal','flip-vertical','flip-both','spin','pulse','pulse-outline','border','fw']);
async function loadTabler(){
  const css = await fetchText('https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css');
  const s = new Set();
  for(const m of css.matchAll(/\.ti-([a-z0-9-]+)::?before/g)) if(!TI_SKIP.has(m[1])) s.add(m[1]);
  if(!s.size) throw new Error('parse failed');
  return { names: [...s].sort() };
}

async function loadRemix(){
  const css = await fetchText('https://cdn.jsdelivr.net/npm/remixicon@latest/fonts/remixicon.css');
  const line = new Set(), fill = new Set();
  for(const m of css.matchAll(/\.ri-([a-z0-9-]+)-line::?before/g)) line.add(m[1]);
  for(const m of css.matchAll(/\.ri-([a-z0-9-]+)-fill::?before/g)) fill.add(m[1]);
  if(!line.size && !fill.size) throw new Error('parse failed');
  return { sets: { line: [...line].sort(), fill: [...fill].sort() } };
}

async function loadPhosphor(){
  const css = await fetchText('https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css');
  const s = new Set();
  for(const m of css.matchAll(/\.ph-([a-z0-9-]+)::?before/g)) s.add(m[1]);
  if(!s.size) throw new Error('parse failed');
  return { names: [...s].sort() };
}

async function loadBootstrap(){
  const css = await fetchText('https://cdn.jsdelivr.net/npm/bootstrap-icons@latest/font/bootstrap-icons.min.css');
  const s = new Set();
  for(const m of css.matchAll(/\.bi-([a-z0-9-]+)::?before/g)) s.add(m[1]);
  if(!s.size) throw new Error('parse failed');
  return { names: [...s].sort() };
}

const MS_CP = 'variablefont/MaterialSymbolsRounded%5BFILL%2CGRAD%2Copsz%2Cwght%5D.codepoints';
async function loadMaterial(){
  /* 2025 年仓库重构后文件改名，多源依次回退 */
  const sources = [
    'https://cdn.jsdelivr.net/gh/google/material-design-icons@master/' + MS_CP,
    'https://raw.githubusercontent.com/google/material-design-icons/master/' + MS_CP,
  ];
  let txt = '', lastErr = null;
  for(const url of sources){
    try{ txt = await fetchText(url); if(txt.trim()) break; }catch(e){ lastErr = e; }
  }
  if(!txt.trim()) throw lastErr || new Error('all sources failed');
  const names = txt.split('\n').map(l => l.trim().split(/\s+/)[0]).filter(Boolean).sort();
  if(!names.length) throw new Error('parse failed');
  return { names };
}

/* Font Awesome：官方 metadata（含每个图标支持的 styles） */
async function loadFontAwesome(){
  const meta = await (await fetch('https://cdn.jsdelivr.net/gh/FortAwesome/Font-Awesome@6.x/metadata/icons.json')).json();
  const sets = { solid:[], regular:[], brands:[] };
  Object.keys(meta).forEach(name => {
    (meta[name].styles || []).forEach(s => { if(sets[s]) sets[s].push(name); });
  });
  Object.values(sets).forEach(a => a.sort());
  if(!sets.solid.length) throw new Error('parse failed');
  return { sets };
}

/* MDI：css 里 ::before 规则即图标（功能类不带 ::before，无需排除） */
async function loadMDI(){
  const css = await fetchText('https://cdn.jsdelivr.net/npm/@mdi/font@latest/css/materialdesignicons.min.css');
  const s = new Set();
  for(const m of css.matchAll(/\.mdi-([a-z0-9-]+)::?before/g)) s.add(m[1]);
  if(!s.size) throw new Error('parse failed');
  return { names: [...s].sort() };
}

/* Boxicons：bx-/bxs-/bxl- 三套（功能类不带 :before） */
async function loadBoxicons(){
  const css = await fetchText('https://cdn.jsdelivr.net/npm/boxicons@latest/css/boxicons.min.css');
  const sets = { regular:new Set(), solid:new Set(), logos:new Set() };
  for(const m of css.matchAll(/\.bx-([a-z0-9-]+)::?before/g)) sets.regular.add(m[1]);
  for(const m of css.matchAll(/\.bxs-([a-z0-9-]+)::?before/g)) sets.solid.add(m[1]);
  for(const m of css.matchAll(/\.bxl-([a-z0-9-]+)::?before/g)) sets.logos.add(m[1]);
  const out = {};
  Object.keys(sets).forEach(k => out[k] = [...sets[k]].sort());
  if(!out.regular.length && !out.solid.length) throw new Error('parse failed');
  return { sets: out };
}

/* jsDelivr npm 工具：解析 latest 版本号 + 拉平文件树 */
async function jsdelivrLatest(pkg){
  const meta = await (await fetch('https://data.jsdelivr.com/v1/packages/npm/' + pkg)).json();
  return (meta.tags && meta.tags.latest) || meta.versions[meta.versions.length - 1];
}
async function flatTree(pkg, ver){
  const t = await (await fetch('https://data.jsdelivr.com/v1/packages/npm/' + pkg + '@' + ver + '?structure=flat')).json();
  return t.files || [];
}

/* Heroicons：SVG 文件树（24 线条 / 24 实心 / 20 迷你） */
let HI_VER = 'latest';
async function loadHeroicons(){
  const ver = await jsdelivrLatest('heroicons');
  const files = await flatTree('heroicons', ver);
  const sets = { outline:[], solid:[], mini:[] };
  files.forEach(f => {
    let m = f.name.match(/^\/24\/outline\/([a-z0-9-]+)\.svg$/); if(m) return sets.outline.push(m[1]);
    m = f.name.match(/^\/24\/solid\/([a-z0-9-]+)\.svg$/);       if(m) return sets.solid.push(m[1]);
    m = f.name.match(/^\/20\/solid\/([a-z0-9-]+)\.svg$/);       if(m) return sets.mini.push(m[1]);
  });
  Object.values(sets).forEach(a => a.sort());
  if(!sets.outline.length) throw new Error('empty heroicons');
  HI_VER = ver;
  return { sets };
}
function heroiconsUrl(name){
  const dir = state.hi === 'mini' ? '20/solid' : '24/' + state.hi;
  return 'https://cdn.jsdelivr.net/npm/heroicons@' + HI_VER + '/' + dir + '/' + encodeURIComponent(name) + '.svg';
}

/* Ionicons：SVG 文件树（填充 / 线条 / 棱角） */
let ION_VER = 'latest';
async function loadIonicons(){
  const ver = await jsdelivrLatest('ionicons');
  const files = await flatTree('ionicons', ver);
  const sets = { filled:new Set(), outline:new Set(), sharp:new Set() };
  files.forEach(f => {
    const m = f.name.match(/^\/dist\/svg\/([a-z0-9-]+)\.svg$/);
    if(!m) return;
    const n = m[1];
    if(n.endsWith('-outline')) sets.outline.add(n.slice(0, -9));
    else if(n.endsWith('-sharp')) sets.sharp.add(n.slice(0, -6));
    else sets.filled.add(n);
  });
  const out = {};
  Object.keys(sets).forEach(k => out[k] = [...sets[k]].sort());
  if(!out.filled.length) throw new Error('parse failed');
  ION_VER = ver;
  return { sets: out };
}
function ioniconsUrl(name){
  const suffix = state.ion === 'filled' ? '' : '-' + state.ion;

}

async function getSvg(url, injectFill){
  const key = url + (injectFill ? '#f' : '');
  if(svgCache.has(key)) return svgCache.get(key);
  let t = (await fetchText(url)).replace(/<\?xml[^>]*>/, '').trim();
  /* ionicons 的 svg 默认无颜色，需补 currentColor 才能跟随主题 */
  if(injectFill) t = t.replace('<svg ', '<svg fill="currentColor" ');
  svgCache.set(key, t);
  return t;
}

}

const store = {};
const injectedCss = new Set();
function injectCss(id){
  LIB_MAP[id].css.forEach(href => {
    if(injectedCss.has(href)) return;
    injectedCss.add(href);
    const l = document.createElement('link');
    l.rel = 'stylesheet';
    l.href = href;
    document.head.appendChild(l);
  });
}
async function ensureLib(id){
  let st = store[id];
  if(st && st.status === 'ok'){ if(state.lib === id) renderGrid(); return; }
  if(st && st.status === 'loading') return;
  injectCss(id);
  store[id] = { status: 'loading' };
  updateLibUI();
  if(state.lib === id) renderGrid();
  try{
    const data = await LIB_MAP[id].load();
    store[id] = Object.assign({ status: 'ok' }, data);
  }catch(err){
    store[id] = { status: 'error', error: err };
  }
  updateLibUI();
  if(state.lib === id) renderGrid();
}
function updateLibUI(){
  LIBS.forEach(lib => {
    const st = store[lib.id];
    const sub = document.querySelector('[data-sub="' + lib.id + '"]');
    const gl = document.querySelector('[data-glyph="' + lib.id + '"]');
    if(sub){
      if(st && st.status === 'ok'){
        const n = st.names ? st.names.length : new Set(Object.values(st.sets).flat()).size;
        sub.textContent = n.toLocaleString() + ' 个图标';
      }else if(st && st.status === 'error'){
        sub.textContent = '加载失败 · 点击重试';
      }
    }
    if(gl && st && st.status === 'ok' && !gl.dataset.filled){
      gl.innerHTML = SAMPLE[lib.id];
      gl.dataset.filled = '1';
    }
  });
}

fetch('skill/zh-index.json').then(r => r.ok ? r.json() : null).then(idx => {
  if(!idx) return;
  for(const [k, v] of Object.entries(idx)){
    if(k === '_pinyin') continue;
    if(!k.startsWith('_')) ZH_MAP[k] = v;
  }
  if(idx._pinyin) Object.assign(ZH_PINYIN, idx._pinyin);

/* 在线翻译兜底（MyMemory，免费无 Key，支持 CORS） */
const ZH_TRANS = {}, ZH_TRANS_REQ = {};
function translateZh2En(q){
  if(q in ZH_TRANS) return Promise.resolve(ZH_TRANS[q]);
  if(ZH_TRANS_REQ[q]) return ZH_TRANS_REQ[q];
  ZH_TRANS_REQ[q] = fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(q) + '&langpair=zh|en')
    .then(r => r.json())
    .then(d => {
      const t = (d && d.responseData && d.responseData.translatedText) || '';
      const en = (t && !/^[A-Z\s-]+ERROR/i.test(t)) ? t.toLowerCase().trim() : '';
      ZH_TRANS[q] = en;
      return en;
    })
    .catch(() => { ZH_TRANS[q] = ''; return ''; });
  return ZH_TRANS_REQ[q];
}
function translatedKws(q){
  const en = ZH_TRANS[q] || '';
  return en ? en.split(/[^a-z0-9]+/).filter(w => w.length > 1) : [];
}
/* 中文词最大匹配分词 + 展开英文关键词分组（每个命中的词条 = 一组同义关键词） */
function expandGroups(q){
  const groups = [];
  const seen = new Set();
  let i = 0;
  while(i < q.length){
    let matched = '';
    /* 贪心：优先长词（词典最长 5 字） */
    for(let len = 5; len >= 1; len--){
      if(i + len > q.length) continue;
      const seg = q.slice(i, i + len);
      if(ZH_MAP[seg]){ matched = seg; break; }
    }
    if(matched){
      if(!seen.has(matched)){ seen.add(matched); groups.push(ZH_MAP[matched]); }
      i += matched.length;
    }else{
      i++;
    }
  }
  return groups;
}
/* 兼容旧调用：拍平 */
function expandQuery(q){
  const kws = new Set();
  expandGroups(q).forEach(g => g.forEach(k => kws.add(k)));
  return [...kws];
}
/* 拼音查询：返回分组（每个拼音词 = 一组） */
function expandPinyinGroups(q){
  const parts = q.toLowerCase().split(/\s+/).filter(Boolean);
  if(!parts.length || !Object.keys(ZH_PINYIN).length) return [];
  const groups = [], seen = new Set();
  for(const p of parts){
    const hit = ZH_PINYIN[p];
    if(hit && !seen.has(p)){ seen.add(p); groups.push(hit); }
  }
  return groups;
}
function expandPinyin(q){
  const kws = new Set();
  expandPinyinGroups(q).forEach(g => g.forEach(k => kws.add(k)));
  return [...kws];
}
const isCJK = q => /[\u4e00-\u9fff]/.test(q);
function activeNames(){
  const st = store[state.lib];
  if(!st || st.status !== 'ok') return [];
  if(state.lib === 'remix') return st.sets[state.remix] || [];
  if(state.lib === 'fontawesome') return st.sets[state.fa] || [];
  if(state.lib === 'boxicons') return st.sets[state.bx] || [];
  if(state.lib === 'heroicons') return st.sets[state.hi] || [];
  if(state.lib === 'ionicons') return st.sets[state.ion] || [];
  return st.names;
}
/* 图标名切词元：按 - _ . 空格切，camelCase 也要拆开 */
function tokenize(n){
  const parts = n.replace(/([a-z0-9])([A-Z])/g, '$1 $2').split(/[-_.\s]+/).filter(Boolean);
  return parts;
}
/* 单个关键词对单个图标名的得分；0 = 不命中 */
const TOKEN_CACHE = new Map();
function scoreName(kw, tokens){
  if(!kw) return 0;
  if(tokens.includes(kw)) return 100;              /* 词元精确命中 */
  const kwToks = kw.split('-').filter(Boolean);
  /* 复合关键词（如 arrow-left）全部词元命中 */
  if(kwToks.length > 1 && kwToks.every(t => tokens.includes(t))) return 85;
  let best = 0;
  for(const t of tokens){
    if(t.startsWith(kw)) best = Math.max(best, 70);  /* 词元前缀命中 */
    else if(kw.length >= 3 && t.includes(kw)) best = Math.max(best, 40); /* 长关键词子串 */
  }
  return best;
}
function tokensOf(name){
  if(!TOKEN_CACHE.has(name)) TOKEN_CACHE.set(name, tokenize(name));
  return TOKEN_CACHE.get(name);
}
/* 评分过滤 + 排序（分组语义）：
   组内关键词 OR（同义词任一命中即得分，取最高）；
   组间 AND（每个概念组都命中才保留）；多组全命中额外加成 */
function rankMatch(names, kws, tags){
  return rankMatchGroups(names, [kws], tags);
}
function rankMatchGroups(names, groups, tags){
  if(!groups.length) return [];
  const out = [];
  for(const n of names){
    const tokens = tokensOf(n);
    const t = tags[n];
    let total = 0, groupHits = 0;
    for(const g of groups){
      let best = 0;
      for(let ki = 0; ki < g.length; ki++){
        let s = scoreName(g[ki], tokens);
        if(!s && t && t.some(x => x.includes(g[ki]))) s = 40;
        s -= ki * 0.01; /* 关键词顺序 = 意图优先级（词典把最贴切的词排前面） */
        if(s > best) best = s;
      }
      if(best > 0){ total += best; groupHits++; }
    }
    if(groupHits === groups.length){
      /* 多概念同时命中 = 强相关 */
      if(groups.length > 1) total += 50 * (groups.length - 1);
      total -= tokens.length * 0.5; /* 名称更短 = 更通用，微弱优先 */
      out.push([n, total]);
    }
  }
  out.sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  return out.map(x => x[0]);
}
function filtered(){
  const q = state.query.trim().toLowerCase();
  const list = activeNames();
  if(!q) return list;
  const tags = (store[state.lib] && store[state.lib].tags) || {};
  /* 中文 / 拼音 / 翻译关键词统一走分组评分排序 */
  const pyGroups = isCJK(q) ? [] : expandPinyinGroups(q);
  if(isCJK(q) || pyGroups.length){
    let groups = expandGroups(q);
    if(!groups.length) groups = pyGroups;             /* 拼音：feiji / fj */
    if(!groups.length){
      const tk = translatedKws(q);                   /* 翻译兜底 */
      if(tk.length) groups = [tk];
    }
    if(!groups.length) return [];
    if(state.tagFilter) return rankMatch(list, [state.tagFilter], tags);
    return rankMatchGroups(list, groups, tags);
  }
  /* 纯英文查询：同样评分排序（精确 > 前缀 > 子串 > tags） */
  if(state.tagFilter) return rankMatch(list, [state.tagFilter], tags);
  return rankMatch(list, [q], tags);
}

    case 'tabler':      return '<i class="glyph ti ti-' + name + '"></i>';

    case 'bootstrap':   return '<i class="glyph bi bi-' + name + '"></i>';
    case 'phosphor':    return '<i class="glyph ' + PH_BASE[state.ph] + ' ph-' + name + '"></i>';
    case 'material':    return '<span class="glyph material-symbols-rounded">' + name + '</span>';
    case 'fontawesome': return '<i class="glyph ' + FA_BASE[state.fa] + ' fa-' + name + '"></i>';
    case 'mdi':         return '<i class="glyph mdi mdi-' + name + '"></i>';
    case 'boxicons': {
      const p = { regular:'bx', solid:'bxs', logos:'bxl' }[state.bx];
      return '<i class="glyph ' + p + ' ' + p + '-' + name + '"></i>';
    }
    case 'heroicons':   return '<span class="lucide-holder" data-svgurl="' + heroiconsUrl(name) + '"><span class="sk"></span></span>';
    case 'ionicons':    return '<span class="lucide-holder" data-svgurl="' + ioniconsUrl(name) + '" data-svgfill="1"><span class="sk"></span></span>';
  }
  return '';
}
function slotHTML(lib, name, size){
  const st = size ? ' style="width:' + size + 'px;height:' + size + 'px;font-size:' + size + 'px"' : '';

}
function cardHTML(name){

function renderGrid(){
  gen++; rendered = 0;

  if(st.status === 'error'){ showPanel('error'); return; }

  if(!filtered().length){ showPanel('empty'); return; }
  hidePanel();

function appendChunk(){
  const list = filtered();
  if(rendered >= list.length){ updateEnd(); return; }
  const CHUNK = (state.lib === 'lucide' || state.lib === 'heroicons' || state.lib === 'ionicons') ? 120 : 240;
  const slice = list.slice(rendered, rendered + CHUNK);
  grid.insertAdjacentHTML('beforeend', slice.map(n => cardHTML(n)).join(''));
  rendered += slice.length;
  if(state.lib === 'lucide' || state.lib === 'heroicons' || state.lib === 'ionicons') fillSlots(grid);
  updateCountUI(); updateEnd();
}

    panelMsg.textContent = lib.label + ' 图标库加载失败（网络或 CDN 异常）';
    reloadBtn.classList.remove('ig-hide');
  }else{
    panelIcon.innerHTML = I_EMPTY;
    panelMsg.textContent = state.query.trim() ? '没有找到与「' + state.query.trim() + '」匹配的图标' : '当前图标库为空';
    reloadBtn.classList.add('ig-hide');
  }
}
function hidePanel(){
  statePanel.classList.add('ig-hide');
  grid.classList.remove('ig-hide');
}
/* 懒加载泵：sentinel 进入预加载区就追加，若追加后仍在视口内则继续（IO 不会重复触发） */
let pumping = false;
function pump(){
  if(pumping) return;
  const st = store[state.lib];
  if(!st || st.status !== 'ok') return;
  if(rendered >= filtered().length){ updateEnd(); return; }
  const cr = sentinel.getBoundingClientRect();
  const vr = contentEl.getBoundingClientRect();
  if(cr.top > vr.bottom + 700) return;
  pumping = true;
  const g = gen;
  appendChunk();
  requestAnimationFrame(() => {
    pumping = false;
    /* 本轮未完成且没有切换/重渲染时继续补齐视口 */
    if(g === gen && rendered < filtered().length) pump();
  });
}
const io = new IntersectionObserver(es => {
  if(es.some(e => e.isIntersecting)) pump();
}, { root: contentEl, rootMargin: '700px 0px' });
io.observe(sentinel);

/* ================= 复制与提示 ================= */
function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = I_CHECK + '<span></span>';
  t.lastChild.textContent = msg;
  toasts.appendChild(t);
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 220); }, 1800);
}
function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;opacity:0';
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  ta.remove();
}
function copyText(text){
  const done = () => toast('已经复制到粘贴板');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done, () => { fallbackCopy(text); done(); });
  }else{
    fallbackCopy(text);
    done();
  }
}

/* ================= 详情弹窗 ================= */
function pascal(n){ return n.split('-').map(s => s.charAt(0).toUpperCase() + s.slice(1)).join(''); }
function codeRow(label, value){
  const wrap = document.createElement('div');
  const multiline = value.indexOf('\n') >= 0;
  wrap.innerHTML =
    '<div class="text-xs text-zinc-500 mb-1.5">' + label + '</div>' +
    '<div class="flex gap-2">' +
      (multiline ? '<textarea readonly rows="7" class="code-box"></textarea>' : '<input readonly class="code-box">') +
      '<button class="copy-btn" title="复制">' + I_COPY + '</button>' +
    '</div>';
  const field = wrap.querySelector('input,textarea');
  field.value = value;
  field.addEventListener('focus', e => e.target.select());
  wrap.querySelector('.copy-btn').addEventListener('click', () => copyText(field.value));
  return wrap;
}
async function openDetail(name){
  const lib = state.lib, conf = LIB_MAP[lib];
  mName.textContent = name;
  mLib.textContent = conf.label;
  mPreview.innerHTML = slotHTML(lib, name, 88);
  mSizes.innerHTML = [16, 24, 32, 48, 64].map(s =>
    '<div class="size-cell">' + slotHTML(lib, name, s) + '<span>' + s + '</span></div>'
  ).join('');
  const rows = [];
  if(lib === 'lucide'){
    let svg = '';
    try{ svg = await getSvg(lucideUrl(name)); }catch(e){}
    rows.push(['名称', name]);
    rows.push(['组件名', pascal(name)]);
    rows.push(['HTML 用法', '<i data-lucide="' + name + '"></i>']);
    rows.push(['CDN 引入', '<script src="https://unpkg.com/lucide@latest"><\/script>']);
    if(svg) rows.push(['SVG 代码', svg]);
  }else if(lib === 'tabler'){
    rows.push(['名称', name]);
    rows.push(['CSS 类名', 'ti ti-' + name]);
    rows.push(['HTML 用法', '<i class="ti ti-' + name + '"></i>']);
    rows.push(['CDN 引入', '<link rel="stylesheet" href="' + conf.css[0] + '">']);
  }else if(lib === 'remix'){
    rows.push(['名称', name]);
    rows.push(['CSS 类名', 'ri ri-' + name + '-' + state.remix]);
    rows.push(['HTML 用法', '<i class="ri ri-' + name + '-' + state.remix + '"></i>']);
    rows.push(['CDN 引入', '<link rel="stylesheet" href="' + conf.css[0] + '">']);
  }else if(lib === 'phosphor'){
    rows.push(['名称', name]);
    rows.push(['CSS 类名', PH_BASE[state.ph] + ' ph-' + name]);
    rows.push(['HTML 用法', '<i class="' + PH_BASE[state.ph] + ' ph-' + name + '"></i>']);
    rows.push(['CDN 引入', '<link rel="stylesheet" href="' + PH_CSS[0] + '">']);
  }else if(lib === 'bootstrap'){
    rows.push(['名称', name]);
    rows.push(['CSS 类名', 'bi bi-' + name]);
    rows.push(['HTML 用法', '<i class="bi bi-' + name + '"></i>']);
    rows.push(['CDN 引入', '<link rel="stylesheet" href="' + conf.css[0] + '">']);
  }else if(lib === 'material'){
    rows.push(['名称', name]);
    rows.push(['HTML 用法', '<span class="material-symbols-rounded">' + name + '</span>']);
    rows.push(['CDN 引入', '<link rel="stylesheet" href="' + conf.css[0] + '">']);
  }else if(lib === 'fontawesome'){
    rows.push(['名称', name]);
    rows.push(['CSS 类名', FA_BASE[state.fa] + ' fa-' + name]);
    rows.push(['HTML 用法', '<i class="' + FA_BASE[state.fa] + ' fa-' + name + '"></i>']);
    rows.push(['CDN 引入', '<link rel="stylesheet" href="' + conf.css[0] + '">']);
  }else if(lib === 'mdi'){
    rows.push(['名称', name]);
    rows.push(['CSS 类名', 'mdi mdi-' + name]);
    rows.push(['HTML 用法', '<i class="mdi mdi-' + name + '"></i>']);
    rows.push(['CDN 引入', '<link rel="stylesheet" href="' + conf.css[0] + '">']);
  }else if(lib === 'boxicons'){
    const p = { regular:'bx', solid:'bxs', logos:'bxl' }[state.bx];
    rows.push(['名称', name]);
    rows.push(['CSS 类名', p + ' ' + p + '-' + name]);
    rows.push(['HTML 用法', '<i class="' + p + ' ' + p + '-' + name + '"></i>']);
    rows.push(['CDN 引入', '<link rel="stylesheet" href="' + conf.css[0] + '">']);
  }else if(lib === 'heroicons'){
    let svg = '';
    try{ svg = await getSvg(heroiconsUrl(name)); }catch(e){}
    rows.push(['名称', name]);
    rows.push(['React 组件', "import { " + pascal(name) + "Icon } from '@heroicons/react/" + (state.hi === 'mini' ? '20/solid' : '24/' + state.hi) + "'"]);
    if(svg) rows.push(['SVG 代码', svg]);
  }else if(lib === 'ionicons'){
    let svg = '';
    try{ svg = await getSvg(ioniconsUrl(name), true); }catch(e){}
    rows.push(['名称', name]);
    rows.push(['Web 组件', '<ion-icon name="' + name + '"></ion-icon>']);
    if(svg) rows.push(['SVG 代码', svg]);
  }
  mRows.innerHTML = '';
  rows.forEach(r => mRows.appendChild(codeRow(r[0], r[1])));
  fillSlots(modal);
  modal.style.display = 'flex';
}
function closeModal(){ modal.style.display = 'none'; }
modal.addEventListener('click', e => { if(e.target.closest('[data-close]')) closeModal(); });
grid.addEventListener('click', e => {
  const c = e.target.closest('.card');
  if(c) openDetail(c.dataset.name);
});

/* ================= 侧栏 / 筹码 / 色板 ================= */
function buildSidebar(){
  libList.innerHTML = '';
  LIBS.forEach(lib => {
    const b = document.createElement('button');
    b.className = 'lib-item' + (lib.id === state.lib ? ' active' : '');
    b.dataset.lib = lib.id;
    b.innerHTML =
      '<span class="lib-glyph" data-glyph="' + lib.id + '"><span class="inline-block w-2 h-2 rounded-full bg-current opacity-30"></span></span>' +
      '<span class="flex-1 min-w-0">' +
        '<span class="lib-title"><span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5" style="background:' + lib.accent + '"></span>' + lib.label + '</span>' +
        '<span class="lib-sub" data-sub="' + lib.id + '">' + lib.desc + '</span>' +
      '</span>';
    b.addEventListener('click', () => { selectLib(lib.id); closeDrawer(); });
    libList.appendChild(b);
  });
}
function buildChips(){
  chipBar.innerHTML = '';
  LIBS.forEach(lib => {
    const b = document.createElement('button');
    b.className = 'chip' + (lib.id === state.lib ? ' active' : '');
    b.dataset.lib = lib.id;
    b.textContent = lib.label;
    b.addEventListener('click', () => selectLib(lib.id));
    chipBar.appendChild(b);
  });
}
function buildSwatches(){
  const box = $('#swatches');
  box.innerHTML = '';
  const auto = document.createElement('button');
  auto.className = 'sw auto' + (state.color ? '' : ' active');
  auto.title = '跟随主题';
  auto.addEventListener('click', () => { state.color = ''; saveState(); applyVars(); buildSwatches(); });
  box.appendChild(auto);
  COLORS.forEach(c => {
    const b = document.createElement('button');
    b.className = 'sw';
    b.style.background = c;
    b.title = c;
    if(state.color === c) b.classList.add('active');
    b.addEventListener('click', () => { state.color = c; saveState(); applyVars(); buildSwatches(); });
    box.appendChild(b);
  });
  const custom = document.createElement('label');
  custom.className = 'sw custom';
  if(state.color && COLORS.indexOf(state.color) < 0) custom.classList.add('active');
  custom.title = '自定义颜色';
  const inp = document.createElement('input');
  inp.type = 'color';
  inp.value = /^#[0-9a-fA-F]{6}$/.test(state.color) ? state.color : '#6366f1';
  inp.className = 'sr-only';
  inp.addEventListener('input', () => { state.color = inp.value; saveState(); applyVars(); buildSwatches(); });
  custom.appendChild(inp);
  box.appendChild(custom);
}

/* ================= 预览设置 ================= */
const sizeSlider = $('#size-slider'), strokeSlider = $('#stroke-slider');
const msFillBtn = $('#ms-fill'), msWghtSlider = $('#ms-wght');
function applyVars(){
  const rs = document.documentElement.style;
  rs.setProperty('--icon-size', state.size + 'px');
  if(state.color) rs.setProperty('--icon-color', state.color); else rs.removeProperty('--icon-color');
  rs.setProperty('--stroke-w', String(state.stroke));
  rs.setProperty('--ms-fill', String(state.msFill));
  rs.setProperty('--ms-wght', String(state.msWght));
  $('#size-val').textContent = state.size + 'px';
  $('#stroke-val').textContent = String(Math.round(state.stroke * 10) / 10);
  $('#ms-wght-val').textContent = state.msWght;
  msFillBtn.classList.toggle('on', !!state.msFill);
  msFillBtn.setAttribute('aria-checked', String(!!state.msFill));
}
sizeSlider.addEventListener('input', () => { state.size = +sizeSlider.value; applyVars(); saveState(); });
strokeSlider.addEventListener('input', () => { state.stroke = +strokeSlider.value; applyVars(); saveState(); });
msWghtSlider.addEventListener('input', () => { state.msWght = +msWghtSlider.value; applyVars(); saveState(); });
msFillBtn.addEventListener('click', () => { state.msFill = state.msFill ? 0 : 1; applyVars(); saveState(); });

function bindSeg(el, key, after){
  el.addEventListener('click', e => {
    const b = e.target.closest('button[data-v]');
    if(!b) return;
    el.querySelectorAll('button').forEach(x => x.classList.toggle('active', x === b));
    state[key] = b.dataset.v;
    saveState();
    if(after) after();
  });
  el.querySelectorAll('button').forEach(x => x.classList.toggle('active', x.dataset.v === String(state[key])));
}
bindSeg($('#remix-seg'), 'remix', renderGrid);
bindSeg($('#ph-seg'), 'ph', renderGrid);
bindSeg($('#fa-seg'), 'fa', renderGrid);
bindSeg($('#hi-seg'), 'hi', renderGrid);
bindSeg($('#ion-seg'), 'ion', renderGrid);
bindSeg($('#bx-seg'), 'bx', renderGrid);

/* ================= 搜索 / 主题 / 抽屉 / 快捷键 ================= */
const kwBar = $('#kw-bar'), kwChips = $('#kw-chips');
function renderKwBar(){
  const q = state.query.trim();
  let kws = [];
  if(q && isCJK(q)){
    kws = expandQuery(q);
    if(!kws.length) kws = translatedKws(q); /* 翻译兜底词也显示为 chips */
  }else if(q){
    kws = expandPinyin(q); /* 拼音命中也显示为 chips */
  }
  if(!kws.length){
    kwBar.classList.add('ig-hide');
    state.tagFilter = '';
    return;
  }
  kwBar.classList.remove('ig-hide');
  kwChips.innerHTML = '';
  kws.forEach(k => {
    const b = document.createElement('button');
    b.className = 'chip' + (state.tagFilter === k ? ' active' : '');
    b.textContent = k;
    b.addEventListener('click', () => {
      state.tagFilter = state.tagFilter === k ? '' : k;
      renderKwBar();
      renderGrid();
    });
    kwChips.appendChild(b);
  });
}
let searchTimer;
searchEl.addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    state.query = searchEl.value;
    state.tagFilter = '';
    clearBtn.classList.toggle('hidden', !searchEl.value);
    kbdHint.classList.toggle('hidden', !!searchEl.value);
    renderKwBar();
    renderGrid();
    /* 词典未命中的中文词 -> 在线翻译兜底，结果回来后自动刷新 */
    const q = state.query.trim();
    if(q && isCJK(q) && !expandQuery(q).length && !translatedKws(q).length){
      translateZh2En(q).then(en => {
        if(en && state.query.trim() === q){
          renderKwBar();
          renderGrid();
        }
      });
    }
  }, 120);
});
clearBtn.addEventListener('click', () => {
  searchEl.value = '';
  state.query = '';
  state.tagFilter = '';
  clearBtn.classList.add('hidden');
  kbdHint.classList.remove('hidden');
  renderKwBar();
  renderGrid();
  searchEl.focus();
});
searchEl.addEventListener('keydown', e => {
  if(e.key === 'Enter'){
    const list = filtered();
    if(list.length) openDetail(list[0]);
  }
});

function updateThemeIcon(){
  const dark = document.documentElement.classList.contains('dark');
  $('#icon-sun').classList.toggle('hidden', dark);
  const moon = $('#icon-moon');
  moon.classList.toggle('hidden', !dark);
  moon.classList.toggle('inline-flex', dark);
  moon.classList.toggle('items-center', dark);
  moon.classList.toggle('gap-1', dark);
}
$('#theme-btn').addEventListener('click', () => {
  const dark = document.documentElement.classList.toggle('dark');
  try{ localStorage.setItem('ig:theme', dark ? 'dark' : 'light'); }catch(e){}
  updateThemeIcon();
});

function closeDrawer(){
  sidebar.classList.remove('open');
  drawerMask.classList.add('ig-hide');
}
$('#menu-btn').addEventListener('click', () => {
  sidebar.classList.add('open');
  drawerMask.classList.remove('ig-hide');
});
$('#drawer-close').addEventListener('click', closeDrawer);
drawerMask.addEventListener('click', closeDrawer);

reloadBtn.addEventListener('click', () => { delete store[state.lib]; ensureLib(state.lib); });

document.addEventListener('keydown', e => {
  const t = e.target;
  const typing = t && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName);
  /* 输入框 Cmd/Ctrl+A 全选（预览环境兜底） */
  if((e.metaKey || e.ctrlKey) && (e.key === 'a' || e.key === 'A') && typing){
    e.preventDefault();
    t.select();
    return;
  }
  if(e.key === '/' && !typing){
    e.preventDefault();
    searchEl.focus();
    searchEl.select();
  }else if(e.key === 'Escape' && modal.style.display !== 'none'){
    closeModal();
  }
});

/* ================= 库切换与启动 ================= */
function selectLib(id){
  state.lib = id;
  saveState();
  $$('.lib-item').forEach(b => b.classList.toggle('active', b.dataset.lib === id));
  $$('.chip').forEach(b => b.classList.toggle('active', b.dataset.lib === id));
  $$('[data-ctl]').forEach(el => el.classList.toggle('on', el.dataset.ctl === id));
  updateHead();
  ensureLib(id);
}

sizeSlider.value = state.size;
strokeSlider.value = state.stroke;
msWghtSlider.value = state.msWght;
buildSidebar();
buildChips();
buildSwatches();
applyVars();
updateThemeIcon();
selectLib(state.lib);

})();
</script>
