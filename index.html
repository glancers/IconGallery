<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IconGallery · 图标选型库</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='2' y='2' width='9' height='9' rx='2.5' fill='%236366f1'/%3E%3Crect x='13' y='2' width='9' height='9' rx='2.5' fill='%23a78bfa'/%3E%3Crect x='2' y='13' width='9' height='9' rx='2.5' fill='%23c7d2fe'/%3E%3Crect x='13' y='13' width='9' height='9' rx='2.5' fill='%238b5cf6'/%3E%3C/svg%3E">
<script>
/* 主题初始化（默认深色），在渲染前设置避免闪烁 */
(function(){
  try{
    var t = JSON.parse(localStorage.getItem('ig:theme') || 'null');
    if(t !== 'light') document.documentElement.classList.add('dark');
  }catch(e){ document.documentElement.classList.add('dark'); }
})();
</script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: { extend: { fontFamily: {
    sans: ['-apple-system','BlinkMacSystemFont','Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue','Arial','sans-serif'],
    mono: ['ui-monospace','SFMono-Regular','Menlo','Consolas','Liberation Mono','monospace']
  }}}
};
</script>
<link rel="stylesheet" href="./css/style.css">
</head>
<body class="bg-zinc-50 dark:bg-zinc-950 text-zinc-800 dark:text-zinc-200 font-sans antialiased overflow-hidden">

<div class="flex h-screen overflow-hidden">

  <!-- ================= 侧栏 ================= -->
  <aside id="sidebar" class="w-64 shrink-0 flex flex-col border-r border-zinc-200 dark:border-zinc-800/70 bg-white dark:bg-zinc-900/40">
    <div class="hidden lg:flex px-4 h-16 border-b border-zinc-200/70 dark:border-zinc-800/70 items-center gap-2.5">
      <svg viewBox="0 0 24 24" class="w-7 h-7 text-zinc-700 dark:text-zinc-300" aria-hidden="true">
        <rect x="2" y="2" width="9" height="9" rx="2.5" fill="#6366f1"/>
        <rect x="13" y="2" width="9" height="9" rx="2.5" fill="#a78bfa"/>
        <rect x="2" y="13" width="9" height="9" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <rect x="13" y="13" width="9" height="9" rx="2.5" fill="#8b5cf6"/>
      </svg>
      <div class="min-w-0">
        <div class="font-semibold text-[15px] leading-tight">IconGallery</div>
        <div class="text-[11px] text-zinc-400 leading-tight">图标选型工作台 · 支持安装为 Skill</div>
      </div>
    </div>

    <!-- 移动端抽屉头部 -->
    <div class="lg:hidden relative px-4 h-16 border-b border-zinc-200/70 dark:border-zinc-800/70 flex items-center gap-2.5">
      <svg viewBox="0 0 24 24" class="w-7 h-7 text-zinc-700 dark:text-zinc-300" aria-hidden="true">
        <rect x="2" y="2" width="9" height="9" rx="2.5" fill="#6366f1"/>
        <rect x="13" y="2" width="9" height="9" rx="2.5" fill="#a78bfa"/>
        <rect x="2" y="13" width="9" height="9" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <rect x="13" y="13" width="9" height="9" rx="2.5" fill="#8b5cf6"/>
      </svg>
      <div class="min-w-0">
        <div class="font-semibold text-[15px] leading-tight">IconGallery</div>
        <div class="text-[11px] text-zinc-400 leading-tight">图标选型工作台 · 支持安装为 Skill</div>
      </div>
      <button id="drawer-close" class="ml-auto w-8 h-8 rounded-lg text-zinc-400 hover:text-zinc-700 dark:hover:text-zinc-200 hover:bg-zinc-100 dark:hover:bg-zinc-800 text-lg leading-none" aria-label="关闭侧栏" onclick="event.preventDefault(); event.stopPropagation();">×</button>
    </div>

    <div class="flex-1 min-h-0 flex flex-col px-3 py-4">
      <div class="shrink-0 px-2 pb-2 text-[11px] font-medium text-zinc-400 tracking-widest">图标库</div>
      <div id="lib-list" class="flex-1 min-h-[120px] overflow-y-auto space-y-1 pb-2 pr-1 -mr-3"></div>

      <div class="shrink-0 px-2 pt-3 pb-2 mt-3 border-t border-zinc-200/70 dark:border-zinc-800/70 text-[11px] font-medium text-zinc-400 tracking-widest">预览设置</div>
      <div class="shrink-0 space-y-5 px-1">
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <span class="text-xs text-zinc-500">图标尺寸</span>
            <span id="size-val" class="text-xs font-mono text-zinc-400">40px</span>
          </div>
          <input id="size-slider" type="range" min="16" max="96" step="4" value="40" class="w-full accent-indigo-500 cursor-pointer">
        </div>

        <div>
          <div class="text-xs text-zinc-500 mb-2">图标颜色</div>
          <div id="swatches" class="flex flex-wrap gap-2"></div>
        </div>

        <div data-ctl="lucide">
          <div class="flex items-center justify-between mb-1.5">
            <span class="text-xs text-zinc-500">描边粗细</span>
            <span id="stroke-val" class="text-xs font-mono text-zinc-400">2</span>
          </div>
          <input id="stroke-slider" type="range" min="1" max="3" step="0.1" value="2" class="w-full accent-indigo-500 cursor-pointer">
        </div>

        <div data-ctl="remix">
          <div class="text-xs text-zinc-500 mb-1.5">风格</div>
          <div id="remix-seg" class="seg">
            <button data-v="line">线条</button><button data-v="fill">填充</button>
          </div>
        </div>

        <div data-ctl="phosphor">
          <div class="text-xs text-zinc-500 mb-1.5">字重风格</div>
          <div id="ph-seg" class="seg seg-wrap">
            <button data-v="thin">细</button><button data-v="light">轻</button><button data-v="regular">常规</button>
            <button data-v="bold">粗</button><button data-v="fill">填充</button><button data-v="duotone">双色</button>
          </div>
        </div>

        <div data-ctl="material">
          <div class="flex items-center justify-between mb-3">
            <span class="text-xs text-zinc-500">填充样式</span>
            <button id="ms-fill" class="switch" role="switch" aria-checked="false"><span class="knob"></span></button>
          </div>
          <div class="flex items-center justify-between mb-1.5">
            <span class="text-xs text-zinc-500">字重</span>
            <span id="ms-wght-val" class="text-xs font-mono text-zinc-400">400</span>
          </div>
          <input id="ms-wght" type="range" min="100" max="700" step="100" value="400" class="w-full accent-indigo-500 cursor-pointer">
        </div>

        <div data-ctl="fontawesome">
          <div class="text-xs text-zinc-500 mb-1.5">风格</div>
          <div id="fa-seg" class="seg">
            <button data-v="solid">实心</button><button data-v="regular">常规</button><button data-v="brands">品牌</button>
          </div>
        </div>

        <div data-ctl="heroicons">
          <div class="text-xs text-zinc-500 mb-1.5">风格</div>
          <div id="hi-seg" class="seg">
            <button data-v="outline">线条</button><button data-v="solid">实心</button><button data-v="mini">迷你</button>
          </div>
        </div>

        <div data-ctl="ionicons">
          <div class="text-xs text-zinc-500 mb-1.5">风格</div>
          <div id="ion-seg" class="seg">
            <button data-v="filled">填充</button><button data-v="outline">线条</button><button data-v="sharp">棱角</button>
          </div>
        </div>

        <div data-ctl="boxicons">
          <div class="text-xs text-zinc-500 mb-1.5">风格</div>
          <div id="bx-seg" class="seg">
            <button data-v="regular">常规</button><button data-v="solid">实心</button><button data-v="logos">Logo</button>
          </div>
        </div>

        <div data-ctl="antd">
          <div class="text-xs text-zinc-500 mb-1.5">风格</div>
          <div id="antd-seg" class="seg">
            <button data-v="outlined">线条</button><button data-v="filled">填充</button><button data-v="twotone">双色</button>
          </div>
        </div>

        <div data-ctl="mingcute">
          <div class="text-xs text-zinc-500 mb-1.5">风格</div>
          <div id="ming-seg" class="seg">
            <button data-v="line">线条</button><button data-v="fill">填充</button>
          </div>
        </div>

        <div data-ctl="iconoir">
          <div class="text-xs text-zinc-500 mb-1.5">风格</div>
          <div id="iconoir-seg" class="seg">
            <button data-v="regular">线条</button><button data-v="solid">实心</button>
          </div>
        </div>

        <div data-ctl="flowbite">
          <div class="text-xs text-zinc-500 mb-1.5">风格</div>
          <div id="flow-seg" class="seg">
            <button data-v="outline">线条</button><button data-v="solid">实心</button>
          </div>
        </div>

        <div data-ctl="solar">
          <div class="text-xs text-zinc-500 mb-1.5">风格</div>
          <div id="solar-seg" class="seg seg-wrap">
            <button data-v="linear">线条</button><button data-v="outline">轮廓</button><button data-v="broken">断裂</button>
            <button data-v="line-duotone">线双色</button><button data-v="bold">填充</button><button data-v="bold-duotone">双色</button>
          </div>
        </div>
      </div>
    </div>

    <div class="px-4 pt-3 pb-3.5 border-t border-zinc-200/70 dark:border-zinc-800/70">
      <p class="text-[11px] text-zinc-400 leading-relaxed">数据版本来自各图标库官方 CDN，仅用于预览选型</p>
    </div>
  </aside>

  <!-- ================= 主区域 ================= -->
  <main class="flex-1 flex flex-col min-w-0">

    <header class="shrink-0 z-20 flex items-center gap-2 sm:gap-3 px-3 sm:px-5 h-16 border-b border-zinc-200 dark:border-zinc-800/70 bg-zinc-50/90 dark:bg-zinc-950/90 backdrop-blur">
      <button id="menu-btn" class="lg:hidden w-9 h-9 -ml-1 rounded-xl flex items-center justify-center text-zinc-500 hover:text-zinc-800 dark:hover:text-zinc-100 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition" aria-label="打开侧栏">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="w-5 h-5"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>

      <div class="relative flex-1 max-w-xl">
        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-zinc-400 pointer-events-none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="w-4 h-4"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        </span>
        <input id="search" type="text" autocomplete="off" spellcheck="false" placeholder="搜索图标，支持中文（如：删除 / 保存 / 天气），按 / 聚焦"          class="w-full h-9 pl-9 pr-11 rounded-full bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 focus:border-indigo-500/60 focus:ring-4 focus:ring-indigo-500/10 outline-none text-sm placeholder:text-zinc-400 transition">
        <button id="clear-search" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 w-6 h-6 rounded-md text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-200 text-base leading-none" aria-label="清空搜索">×</button>
        <kbd id="kbd-hint" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-[10px] font-mono text-zinc-400 border border-zinc-200 dark:border-zinc-700 rounded px-1.5 py-0.5 pointer-events-none">/</kbd>
      </div>

      <a href="https://github.com/glancers/IconGallery" target="_blank" rel="noopener" title="GitHub 仓库：glancers/IconGallery" class="ml-auto h-8 px-1 flex items-center gap-1.5 text-xs font-medium text-zinc-500 hover:text-zinc-800 dark:hover:text-zinc-100 transition">
        <svg viewBox="0 0 24 24" fill="currentColor" class="w-3.5 h-3.5" aria-hidden="true"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.55 0-.27-.01-1.17-.02-2.12-3.2.7-3.88-1.36-3.88-1.36-.52-1.33-1.28-1.68-1.28-1.68-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.19 1.76 1.19 1.03 1.76 2.69 1.25 3.35.96.1-.75.4-1.25.72-1.54-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.29 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.77 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.8 1.19 1.83 1.19 3.09 0 4.42-2.7 5.39-5.27 5.68.41.36.78 1.05.78 2.12 0 1.54-.01 2.77-.01 3.15 0 .3.2.67.8.55C20.21 21.38 23.5 17.08 23.5 12 23.5 5.65 18.35.5 12 .5Z"/></svg>
        <span class="hidden sm:inline">glancers/IconGallery</span>
      </a>

      <button id="theme-btn" class="h-9 pl-2 pr-2.5 rounded-full border border-zinc-200 dark:border-zinc-800 flex items-center gap-1 text-zinc-500 hover:text-zinc-800 dark:hover:text-zinc-100 hover:border-zinc-300 dark:hover:border-zinc-700 transition" aria-label="切换主题">
        <span id="icon-sun" class="inline-flex items-center gap-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="w-4 h-4"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg><span class="text-xs font-medium">明亮</span></span>
        <span id="icon-moon" class="hidden"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg><span class="text-xs font-medium">黑暗</span></span>
      </button>
    </header>

    <div id="kw-bar" class="ig-hide shrink-0 flex items-center gap-2 overflow-x-auto px-3 sm:px-5 py-2 border-b border-zinc-200 dark:border-zinc-800/70 bg-indigo-50/60 dark:bg-indigo-950/20">
      <span class="text-[11px] text-indigo-500/80 dark:text-indigo-300/80 whitespace-nowrap flex items-center gap-1">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="w-3.5 h-3.5"><path d="M4 20h4L20.5 7.5a2.1 2.1 0 0 0-4-4L4 16v4Z"/><path d="m15 5 4 4"/></svg>
        中文匹配
      </span>
      <div id="kw-chips" class="flex gap-1.5"></div>
    </div>

    <div id="chip-bar" class="lg:hidden shrink-0 flex gap-2 overflow-x-auto px-3 py-2 border-b border-zinc-200 dark:border-zinc-800/70 bg-zinc-50/90 dark:bg-zinc-950/90"></div>

    <div id="content" class="flex-1 overflow-y-auto min-h-0">
      <div class="px-4 sm:px-6 pt-5 pb-4 flex items-center gap-2">
        <h1 id="lib-title" class="text-lg font-semibold tracking-tight"></h1>
        <a id="lib-site" target="_blank" rel="noopener" class="text-zinc-400 hover:text-indigo-500 transition" aria-label="访问官网">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-3.5 h-3.5"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
        </a>
      </div>
      <p id="lib-desc" class="px-4 sm:px-6 -mt-3 pb-3 text-xs text-zinc-500"></p>

      <div id="grid" class="ig-grid px-4 sm:px-6"></div>

      <div id="sentinel" class="ig-hide py-8 flex flex-col items-center gap-2 text-xs text-zinc-400">
        <div class="spinner"></div><span>向下滚动，加载更多</span>
      </div>
      <div id="end-note" class="ig-hide py-8 text-center text-xs text-zinc-400"></div>

      <!-- 搜索时：当前库结果下方追加其他图标库的搜索结果 -->
      <div id="other-libs" class="px-4 sm:px-6"></div>

      <div id="state-panel" class="ig-hide flex flex-col items-center justify-center gap-3 py-24 text-zinc-400">
        <div id="panel-icon"></div>
        <p id="panel-msg" class="text-sm"></p>
        <button id="reload-btn" class="ig-hide px-4 py-2 rounded-xl text-sm font-medium text-white bg-indigo-500 hover:bg-indigo-600 transition">重新加载</button>
      </div>
    </div>
  </main>
</div>

<!-- 抽屉遮罩（移动端） -->
<div id="drawer-mask" class="ig-hide fixed inset-0 z-30 bg-black/60 backdrop-blur-sm"></div>

<!-- ================= 图标详情弹窗 ================= -->
<div id="modal" style="display:none" class="fixed inset-0 z-50 items-center justify-center p-4">
  <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" data-close></div>
  <div id="m-dialog" class="relative w-full max-w-xl bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-2xl shadow-2xl max-h-[88vh] overflow-y-auto p-5 sm:p-6">
    <button data-close class="absolute top-3.5 right-3.5 w-8 h-8 rounded-lg flex items-center justify-center text-zinc-400 hover:text-zinc-700 dark:hover:text-zinc-200 hover:bg-zinc-100 dark:hover:bg-zinc-800 text-lg leading-none" aria-label="关闭">×</button>
    <div class="flex items-center gap-3 mb-5 pr-8">
      <span id="m-lib" class="text-xs px-2 py-0.5 rounded-full bg-indigo-500/10 text-indigo-600 dark:text-indigo-300 font-medium whitespace-nowrap"></span>
      <h3 id="m-name" class="font-mono font-semibold text-base truncate"></h3>
    </div>
    <div class="h-36 rounded-xl border border-dashed border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-950/40 flex items-center justify-center mb-5 px-4">
      <div id="m-sizes" class="flex items-end gap-4 flex-wrap justify-center"></div>
    </div>
    <!-- 颜色 / 风格配置：弹窗局部，仅影响弹窗内预览与代码，不改全局预览设置 -->
    <div id="m-config" class="space-y-4 mb-5"></div>
    <div id="m-info-rows" class="space-y-3 mb-4"></div>
    <div id="m-tabs" class="seg mb-2.5"></div>
    <div id="m-tab-panel"></div>
    <!-- 发给 AI：两种提示词写法（装没装 Skill 都能用），复制粘贴给 AI 即可 -->
    <div id="m-ai" class="rounded-xl border border-indigo-200/80 dark:border-indigo-400/25 bg-indigo-50/70 dark:bg-indigo-500/10 p-3.5 mt-4">
      <div class="flex items-center justify-between gap-2 mb-2.5">
        <span class="flex items-center gap-1.5 text-xs font-medium text-indigo-600 dark:text-indigo-300 whitespace-nowrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-3.5 h-3.5"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3z"/><path d="M19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9L19 15z"/></svg>
          复制并发给AI使用
        </span>
        <div id="m-ai-seg" class="seg seg-mini">
          <button data-v="skilled" class="active">已装 Skill</button>
          <button data-v="plain">未装 Skill</button>
        </div>
      </div>
      <div id="m-ai-panel"></div>
    </div>
  </div>
</div>

<!-- 复制成功提示 -->
<div id="toasts" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[60] flex flex-col items-center gap-2 pointer-events-none"></div>

<!-- 收藏栏（有收藏时显示） -->
<div id="fav-bar" class="ig-hide fixed bottom-5 right-5 z-40"></div>

<!-- ================= 收藏对比弹窗 ================= -->
<div id="compare" style="display:none" class="fixed inset-0 z-50 items-center justify-center p-4">
  <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" data-cclose></div>
  <div class="relative w-full max-w-3xl bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-2xl shadow-2xl max-h-[88vh] overflow-y-auto p-5 sm:p-6">
    <button data-cclose class="absolute top-3.5 right-3.5 w-8 h-8 rounded-lg flex items-center justify-center text-zinc-400 hover:text-zinc-700 dark:hover:text-zinc-200 hover:bg-zinc-100 dark:hover:bg-zinc-800 text-lg leading-none" aria-label="关闭">×</button>
    <div class="flex items-center gap-3 mb-1 pr-8">
      <h3 class="font-semibold text-base">图标对比</h3>
      <span id="cmp-count" class="text-xs text-zinc-400"></span>
    </div>
    <p class="text-xs text-zinc-400 mb-5">跨库收藏的图标横向对照，点击任意一个查看代码</p>
    <div id="cmp-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3"></div>
    <p id="cmp-empty" class="ig-hide py-16 text-center text-sm text-zinc-400">还没有收藏任何图标——鼠标移到图标上点右上角心形按钮收藏</p>
